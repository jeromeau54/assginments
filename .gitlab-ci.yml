stages:
  - build
  - test
  - package
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_COMMIT_SHA

build-gateway:
  stage: build
  image: golang:1.21-alpine
  script:
    - cd services/gateway
    - go mod download
    - CGO_ENABLED=0 go build -o ../../bin/gateway ./cmd/gateway
  artifacts:
    paths:
      - bin/gateway
    expire_in: 1 hour

build-pinger:
  stage: build
  image: golang:1.21-alpine
  script:
    - cd services/pinger
    - go mod download
    - CGO_ENABLED=0 go build -o ../../bin/pinger ./cmd/pinger
  artifacts:
    paths:
      - bin/pinger
    expire_in: 1 hour

test-gateway:
  stage: test
  image: golang:1.21-alpine
  needs:
    - build-gateway
  script:
    - cd services/gateway
    - go test ./...

test-pinger:
  stage: test
  image: golang:1.21-alpine
  needs:
    - build-pinger
  script:
    - cd services/pinger
    - go test ./...

package-gateway:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE/gateway:$IMAGE_TAG -f services/gateway/Dockerfile services/gateway/
    - docker save $CI_REGISTRY_IMAGE/gateway:$IMAGE_TAG -o gateway.tar
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/gateway:$IMAGE_TAG
  artifacts:
    paths:
      - gateway.tar
    expire_in: 1 day

package-pinger:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE/pinger:$IMAGE_TAG -f services/pinger/Dockerfile services/pinger/
    - docker save $CI_REGISTRY_IMAGE/pinger:$IMAGE_TAG -o pinger.tar
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/pinger:$IMAGE_TAG
  artifacts:
    paths:
      - pinger.tar
    expire_in: 1 day

deploy-to-cluster:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  environment:
    name: staging
    url: https://staging.internal
  script:
    - kubectl config current-context
    - |
      cat >> k8s/overlays/staging/kustomization.yaml <<EOF
      images:
        - name: devops/gateway
          newName: $CI_REGISTRY_IMAGE/gateway
          newTag: "$IMAGE_TAG"
        - name: devops/pinger
          newName: $CI_REGISTRY_IMAGE/pinger
          newTag: "$IMAGE_TAG"
      EOF
    - kubectl apply -k k8s/overlays/staging/
    - kubectl -n assessment rollout status deployment/gateway
    - kubectl -n assessment rollout status deployment/pinger
  only:
    - main
